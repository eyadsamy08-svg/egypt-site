<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تجربة العداد الفوري</title>
    <style>
        body {
            background-color: #121212;
            color: white;
            font-family: Arial;
            text-align: center;
            padding-top: 50px;
        }
        .box {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 10px;
            display: inline-block;
            border: 2px solid #00ff88;
        }
        button {
            background-color: #00ff88;
            color: black;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
        }
        button:hover {
            background-color: #00cc6a;
        }
    </style>
</head>
<body>

    <div class="box">
        <h2>اللاعبين المتواجدين حالياً:</h2>
        <!-- الرقم اللي هيتغير قدامك -->
        <h1 id="counter" style="color: #00ff88; font-size: 50px;">0</h1>
        <button id="enterBtn">اضغط هنا </button>
        <button>save</button>
    
    </div>

    <script src="main.js"></script>
</body>
</html>
